<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YNF CELL PPOB</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        h2, h3 { margin-top: 0; color: #f39c12; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 13px; color: #ccc; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #f39c12; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; color: #000; }
        #alert { padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; font-weight: bold; text-align: center; }
        .success { background: #27ae60; color: #fff; }
        .danger { background: #e74c3c; color: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        th, td { padding: 8px; border-bottom: 1px solid #333; text-align: left; }
        th { background: #252525; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <div id="alert"></div>

    <div class="card">
        <h2>📱 Input Transaksi</h2>
        <form id="txForm">
            <div class="form-group">
                <label>Tanggal</label>
                <input type="date" id="tanggal" required>
            </div>
            <div class="form-group">
                <label>Nama Pelanggan</label>
                <input type="text" id="nama" placeholder="Contoh: Budi" required>
            </div>
            <div class="form-group">
                <label>Nomor HP / Tujuan</label>
                <input type="text" id="nomor" placeholder="Contoh: 081234567890" required>
            </div>
            <div class="form-group">
                <label>Produk</label>
                <select id="produk">
                    <option value="Pulsa">Pulsa</option>
                    <option value="Paket Data">Paket Data</option>
                    <option value="Token PLN">Token PLN</option>
                    <option value="Voucher Game">Voucher Game</option>
                </select>
            </div>
            <div class="form-group">
                <label>Rincian Paket</label>
                <input type="text" id="paket" placeholder="Contoh: 10 GB / 20k Token">
            </div>
            <div class="form-group">
                <label>Harga (Rp)</label>
                <input type="number" id="harga" placeholder="25000" required>
            </div>
            <div class="form-group">
                <label>Status Pembayaran</label>
                <select id="status_pembayaran">
                    <option value="LUNAS">LUNAS</option>
                    <option value="HUTANG">HUTANG</option>
                </select>
            </div>
            <button type="submit" id="btnSimpan">Simpan Transaksi</button>
        </form>
    </div>

    <div class="card">
        <h3>📋 Rekap Transaksi Terbaru</h3>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Pelanggan</th>
                        <th>Produk</th>
                        <th>Harga</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="rekapTable">
                    <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];

    function showAlert(text, isOk) {
        const a = document.getElementById('alert');
        a.innerText = text;
        a.className = isOk ? 'success' : 'danger';
        a.style.display = 'block';
        setTimeout(() => { a.style.display = 'none'; }, 5000);
    }

    async function loadRekap() {
        try {
            const res = await fetch('/api/transaksi');
            const data = await res.json();
            const tbody = document.getElementById('rekapTable');

            if (data.ok && data.data.length > 0) {
                tbody.innerHTML = data.data.map(i => `
                    <tr>
                        <td>${i.tanggal}</td>
                        <td><b>${i.nama}</b><br><small>${i.nomor}</small></td>
                        <td>${i.produk} (${i.paket || '-'})</td>
                        <td>Rp ${Number(i.harga).toLocaleString('id-ID')}</td>
                        <td><b>${i.status_pembayaran}</b></td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data.</td></tr>';
            }
        } catch (e) {
            console.error(e);
        }
    }

    document.getElementById('txForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSimpan');
        btn.disabled = true;
        btn.innerText = 'Menyimpan...';

        const payload = {
            tanggal: document.getElementById('tanggal').value,
            nama: document.getElementById('nama').value,
            nomor: document.getElementById('nomor').value,
            produk: document.getElementById('produk').value,
            paket: document.getElementById('paket').value,
            harga: document.getElementById('harga').value,
            status_pembayaran: document.getElementById('status_pembayaran').value
        };

        try {
            const res = await fetch('/api/transaksi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await res.json();

            if (res.ok && result.ok) {
                showAlert('✅ ' + result.message, true);
                document.getElementById('nama').value = '';
                document.getElementById('nomor').value = '';
                document.getElementById('paket').value = '';
                document.getElementById('harga').value = '';
                loadRekap();
            } else {
                showAlert('❌ ' + (result.message || 'Gagal menyimpan ke server'), false);
            }
        } catch (err) {
            showAlert('❌ KONEKSI ERROR: ' + err.message, false);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Simpan Transaksi';
        }
    });

    loadRekap();
</script>

</body>
</html>
